<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asthana Bakery POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFF8F1;
            color: #4A4A4A;
        }
        .main-header {
            background-color: #6A0B0B;
            color: white;
        }
        .btn-primary {
            background-color: #6A0B0B;
            color: white;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #8A0F0F;
        }
        .btn-secondary {
            background-color: #f3f4f6;
            color: #4A4A4A;
            transition: background-color 0.3s;
        }
        .btn-secondary:hover {
            background-color: #e5e7eb;
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
        }
        .product-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .disabled-card {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6A0B0B;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Styles for mobile cart overlay */
        #cart-section.mobile-overlay {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        #cart-section.mobile-overlay.active {
            transform: translateX(0);
        }
    </style>
</head>
<body class="antialiased">

    <div id="app" class="h-screen w-screen flex flex-col">
        <header class="main-header shadow-md p-3 flex justify-between items-center z-20">
            <h1 class="text-xl font-bold">Asthana Bakery POS</h1>
            <div class="text-sm">
                <span id="outlet-display" class="font-semibold">No Outlet</span> | 
                <span id="staff-display">No Staff</span>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-hidden hidden relative">
            <div class="flex h-full">
                <div class="flex-1 flex flex-col p-4">
                    <div class="mb-4">
                        <input type="text" id="search-bar" placeholder="Search for products..." class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-[#8A0F0F] focus:outline-none shadow-sm">
                    </div>
                    <div id="product-grid" class="flex-1 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 overflow-y-auto pb-4 pr-2">
                        </div>
                </div>

                <div id="cart-section" class="w-full md:w-96 bg-white shadow-lg flex-col border-l border-gray-200 hidden md:flex">
                    <div class="p-4 border-b flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-gray-800">Current Bill</h2>
                         <button id="close-cart-btn" class="md:hidden text-gray-500 hover:text-gray-800">
                              <i class="fa-solid fa-times fa-lg"></i>
                         </button>
                    </div>
                    <div id="cart-items" class="flex-1 overflow-y-auto p-2">
                        <div id="cart-placeholder" class="h-full flex flex-col items-center justify-center text-gray-400">
                            <i class="fa-solid fa-cart-shopping fa-3x mb-4"></i>
                            <p>Your cart is empty</p>
                        </div>
                    </div>
                    <div class="p-4 bg-gray-50 border-t mt-auto">
                        <div class="flex justify-between items-center text-xl font-bold mb-4">
                            <span>Total</span>
                            <span id="cart-total">₹0.00</span>
                        </div>
                        <button id="complete-sale-btn" class="w-full btn-primary font-bold py-3 rounded-lg disabled:opacity-50" disabled>
                            Complete Sale
                        </button>
                         <div class="flex space-x-2 mt-2">
                              <button id="print-bill-btn" class="w-1/2 btn-secondary font-bold py-2 rounded-lg disabled:opacity-50" disabled>Print Bill</button>
                              <button id="reprint-bill-btn" class="w-1/2 btn-secondary font-bold py-2 rounded-lg">Reprint Bill</button>
                         </div>
                    </div>
                </div>
            </div>
             <button id="mobile-cart-btn" class="md:hidden fixed bottom-6 right-6 btn-primary rounded-full shadow-lg px-4 py-3 flex items-center space-x-2">
                <i class="fa-solid fa-receipt"></i>
                <span id="mobile-cart-info">View Bill</span>
            </button>
        </main>
        
        <div id="loading-overlay" class="absolute inset-0 bg-white flex flex-col items-center justify-center z-50">
            <div id="loader-spinner" class="loader"></div>
            <p id="loading-text" class="mt-4 text-lg font-medium">Initializing...</p>
            <div id="setup-section" class="hidden mt-6 text-center">
                <h2 class="text-2xl font-bold mb-4">Bakery Setup</h2>
                <div class="w-72 mx-auto">
                    <select id="outlet-select" class="w-full p-3 border rounded-lg mb-4 hidden"></select>
                    <select id="staff-select" class="w-full p-3 border rounded-lg mb-4 hidden"></select>
                    <button id="confirm-setup-btn" class="w-full btn-primary font-bold py-3 rounded-lg hidden">Confirm Selection</button>
                </div>
                <p id="setup-error" class="text-red-500 mt-4"></p>
                <button id="retry-btn" class="mt-4 w-72 btn-primary font-bold py-3 rounded-lg hidden">Retry Connection</button>
            </div>
        </div>

    </div>

    <div id="modal-container"></div>
    
    <div id="snackbar" class="fixed bottom-5 right-5 bg-gray-800 text-white py-3 px-5 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
        Message
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = {
                API_BASE_URL: 'https://web-production-b7e2a.up.railway.app',

                // State
                outlets: [],
                staff: [],
                products: [],
                cart: {}, // Use an object for easy item management by ID
                selectedOutlet: null,
                selectedStaff: null,

                // DOM Elements
                elements: {
                    loaderSpinner: document.getElementById('loader-spinner'),
                    loadingOverlay: document.getElementById('loading-overlay'),
                    loadingText: document.getElementById('loading-text'),
                    setupSection: document.getElementById('setup-section'),
                    outletSelect: document.getElementById('outlet-select'),
                    staffSelect: document.getElementById('staff-select'),
                    confirmSetupBtn: document.getElementById('confirm-setup-btn'),
                    setupError: document.getElementById('setup-error'),
                    retryBtn: document.getElementById('retry-btn'),
                    mainContent: document.getElementById('main-content'),
                    outletDisplay: document.getElementById('outlet-display'),
                    staffDisplay: document.getElementById('staff-display'),
                    productGrid: document.getElementById('product-grid'),
                    searchBar: document.getElementById('search-bar'),
                    cartSection: document.getElementById('cart-section'),
                    cartItems: document.getElementById('cart-items'),
                    cartPlaceholder: document.getElementById('cart-placeholder'),
                    cartTotal: document.getElementById('cart-total'),
                    completeSaleBtn: document.getElementById('complete-sale-btn'),
                    printBillBtn: document.getElementById('print-bill-btn'),
                    reprintBillBtn: document.getElementById('reprint-bill-btn'),
                    modalContainer: document.getElementById('modal-container'),
                    snackbar: document.getElementById('snackbar'),
                    mobileCartBtn: document.getElementById('mobile-cart-btn'),
                    mobileCartInfo: document.getElementById('mobile-cart-info'),
                    closeCartBtn: document.getElementById('close-cart-btn'),
                },

                init() {
                    this.elements.searchBar.addEventListener('input', () => this.renderProducts());
                    this.elements.confirmSetupBtn.addEventListener('click', () => this.confirmSetup());
                    this.elements.completeSaleBtn.addEventListener('click', () => this.processSale());
                    this.elements.printBillBtn.addEventListener('click', () => this.printBill(this.getCartAsArray(), null));
                    this.elements.reprintBillBtn.addEventListener('click', () => this.promptForReprint());
                    this.elements.mobileCartBtn.addEventListener('click', () => this.showMobileCart());
                    this.elements.closeCartBtn.addEventListener('click', () => this.hideMobileCart());
                    this.elements.retryBtn.addEventListener('click', () => this.startSetup());
                    
                    this.handleResize();
                    window.addEventListener('resize', () => this.handleResize());
                    this.startSetup();
                },

                // --- SETUP FLOW ---
                async startSetup() {
                    // Reset UI to initial loading state
                    this.elements.loaderSpinner.classList.remove('hidden');
                    this.elements.loadingText.classList.remove('hidden');
                    this.setLoadingText("Initializing...");
                    this.elements.setupError.textContent = '';
                    this.elements.retryBtn.classList.add('hidden');
                    this.elements.outletSelect.classList.add('hidden');
                    this.elements.staffSelect.classList.add('hidden');
                    this.elements.confirmSetupBtn.classList.add('hidden');
                    this.elements.setupSection.classList.add('hidden');

                    if (!navigator.onLine) {
                        this.showSetupError("No internet connection. Please check your network.");
                        return;
                    }
                    await this.fetchOutlets();
                },

                async fetchOutlets() {
                    this.setLoadingText("Fetching Outlets...");
                    try {
                        const response = await fetch(`${this.API_BASE_URL}/outlets/manage/`);
                        if (!response.ok) throw new Error('Failed to load outlets. Please check server status.');
                        this.outlets = await response.json();
                        
                        const salesOutlets = this.outlets;

                        if (salesOutlets.length === 0) {
                            this.showSetupError("No outlets found. Please configure in the Owner App.");
                            return;
                        }
                        
                        this.elements.outletSelect.innerHTML = salesOutlets.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
                        this.elements.loadingText.classList.add('hidden');
                        this.elements.setupSection.classList.remove('hidden');
                        this.elements.outletSelect.classList.remove('hidden');

                        await this.fetchStaff();

                    } catch (error) {
                        this.showSetupError(error.message);
                    }
                },

                async fetchStaff() {
                    this.setLoadingText("Fetching Staff...");
                    this.elements.loadingText.classList.remove('hidden');
                    this.elements.loaderSpinner.classList.remove('hidden');
                    try {
                        const response = await fetch(`${this.API_BASE_URL}/staff/list/`);
                        if (!response.ok) throw new Error('Failed to load staff.');
                        this.staff = await response.json();

                        if (this.staff.length === 0) {
                             this.showSetupError("No staff members found. Please add staff in the Owner App.");
                             return;
                        }
                        
                        this.elements.staffSelect.innerHTML = this.staff.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                        this.elements.loadingText.classList.add('hidden');
                        this.elements.loaderSpinner.classList.add('hidden');
                        this.elements.staffSelect.classList.remove('hidden');
                        this.elements.confirmSetupBtn.classList.remove('hidden');

                    } catch (error) {
                        this.showSetupError(error.message);
                    }
                },

                confirmSetup() {
                    const outletId = this.elements.outletSelect.value;
                    const staffId = this.elements.staffSelect.value;
                    
                    this.selectedOutlet = this.outlets.find(o => o.id === outletId);
                    this.selectedStaff = this.staff.find(s => s.id === staffId);
                    
                    if (this.selectedOutlet && this.selectedStaff) {
                        this.elements.outletDisplay.textContent = this.selectedOutlet.name;
                        this.elements.staffDisplay.textContent = this.selectedStaff.name;
                        this.startApplication();
                    }
                },

                async startApplication() {
                    this.elements.loadingOverlay.classList.remove('flex');
                    this.elements.loadingOverlay.classList.add('hidden');
                    this.elements.mainContent.classList.remove('hidden');
                    
                    this.elements.productGrid.innerHTML = `<div class="col-span-full h-full flex items-center justify-center"><div class="loader"></div></div>`;
                    
                    await this.fetchProducts();
                },
                
                async fetchProducts() {
                    try {
                        const response = await fetch(`${this.API_BASE_URL}/items/manage-products/`);
                        if (!response.ok) throw new Error('Failed to load products.');
                        this.products = await response.json();
                        this.renderProducts();
                    } catch (error) {
                         this.showSnackbar(error.message, true);
                         this.elements.productGrid.innerHTML = `<div class="col-span-full h-full flex items-center justify-center text-red-500">${error.message}</div>`;
                    }
                },

                // =================================================================
                //  FIX #2: REPLACED WITH BULLETPROOF FUNCTION
                // =================================================================
                renderProducts() {
                    const query = this.elements.searchBar.value.toLowerCase();
                    
                    if (!this.products || this.products.length === 0) {
                        this.elements.productGrid.innerHTML = `<div class="col-span-full h-full flex items-center justify-center text-gray-500">No products available.</div>`;
                        return;
                    }

                    const filteredProducts = this.products.filter(p => (p.name || '').toLowerCase().includes(query));
                    
                    if (filteredProducts.length === 0) {
                        this.elements.productGrid.innerHTML = `<div class="col-span-full h-full flex items-center justify-center text-gray-500">No products match your search.</div>`;
                        return;
                    }

                    const generatedHTML = filteredProducts.map(product => {
                        // --- Safer data handling ---
                        const productName = product.name || 'Unnamed Product';
                        const productPrice = product.price || 0;
                        const productStock = product.stock || 0;
                        const productUnitType = product.unit_type || 'piece';
                        const isOutOfStock = productUnitType === 'piece' && productStock <= 0;
                        const cardClass = isOutOfStock ? 'disabled-card' : '';
                        
                        // --- Safer image placeholder ---
                        const firstChar = productName.charAt(0) || '?';
                        const placeholder = `https://placehold.co/200x200/FFF8F1/6A0B0B?text=${firstChar}`;
                        const image = product.image_url ? `<img src="${product.image_url}" alt="${productName}" class="w-full h-24 object-cover" onerror="this.onerror=null;this.src='${placeholder}';">` : `<img src="${placeholder}" alt="${productName}" class="w-full h-24 object-cover">`;

                        return `
                            <div class="product-card bg-white rounded-lg shadow overflow-hidden cursor-pointer ${cardClass}" data-product-id="${product.id}">
                                ${image}
                                <div class="p-3 text-center">
                                    <h3 class="font-semibold text-sm truncate">${productName}</h3>
                                    <p class="text-xs text-gray-600">₹${productPrice.toFixed(2)} / ${productUnitType === 'kg' ? 'kg' : 'pc'}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    this.elements.productGrid.innerHTML = generatedHTML;

                    // Re-attach event listeners
                    this.elements.productGrid.querySelectorAll('.product-card:not(.disabled-card)').forEach(card => {
                        card.addEventListener('click', (e) => {
                            const productId = e.currentTarget.dataset.productId;
                            const product = this.products.find(p => p.id === productId);
                            if (product) {
                                if (product.unit_type === 'piece') {
                                    this.showPieceModal(product);
                                } else {
                                    this.showWeightModal(product);
                                }
                            }
                        });
                    });
                },

                addToCart(product, details) {
                    const cartId = details.cartId || `${product.id}_${Date.now()}`;
                    if (product.unit_type === 'piece' && !details.cartId) {
                        const existingCartId = Object.keys(this.cart).find(id => this.cart[id].product.id === product.id);
                        if (existingCartId) {
                            this.cart[existingCartId].quantity += details.quantity;
                            this.showSnackbar(`${product.name} quantity updated in cart.`);
                            this.renderCart();
                            return;
                        }
                    }
                    this.cart[cartId] = { product, ...details };
                    this.showSnackbar(`${product.name} added to cart.`);
                    this.renderCart();
                },

                removeFromCart(cartId) {
                    delete this.cart[cartId];
                    this.showSnackbar('Item removed from cart.');
                    this.renderCart();
                },
                
                renderCart() {
                    const cartIds = Object.keys(this.cart);
                    const total = this.getCartTotal();

                    if (cartIds.length === 0) {
                        this.elements.cartItems.innerHTML = '';
                        this.elements.cartPlaceholder.classList.remove('hidden');
                        this.elements.cartTotal.textContent = '₹0.00';
                        this.elements.mobileCartInfo.textContent = 'View Bill';
                        this.elements.completeSaleBtn.disabled = true;
                        this.elements.printBillBtn.disabled = true;
                        return;
                    }
                    
                    this.elements.cartPlaceholder.classList.add('hidden');
                    this.elements.cartTotal.textContent = `₹${total.toFixed(2)}`;
                    this.elements.mobileCartInfo.textContent = `Bill (${cartIds.length}) - ₹${total.toFixed(0)}`;
                    this.elements.completeSaleBtn.disabled = false;
                    this.elements.printBillBtn.disabled = false;
                    
                    this.elements.cartItems.innerHTML = cartIds.map(cartId => {
                        const item = this.cart[cartId];
                        const itemTotal = this.calculateItemTotal(item);
                        
                        let subtitle = '';
                        if (item.quantity) subtitle = `Qty: ${item.quantity} x ₹${(item.product.price || 0).toFixed(2)}`;
                        if (item.weightGrams) subtitle = `${item.weightGrams}g @ ₹${(item.product.price || 0).toFixed(2)}/kg`;

                        return `
                            <div class="p-3 mb-2 bg-gray-50 rounded-lg flex items-center justify-between">
                                <div class="flex-1 mr-2">
                                    <p class="font-semibold text-sm truncate">${item.product.name}</p>
                                    <p class="text-xs text-gray-500">${subtitle}</p>
                                </div>
                                <div class="text-right">
                                    <p class="font-bold">₹${itemTotal.toFixed(2)}</p>
                                     <button class="text-red-500 text-xs hover:underline" data-cart-id="${cartId}">Remove</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    this.elements.cartItems.querySelectorAll('button').forEach(btn => {
                        btn.addEventListener('click', (e) => this.removeFromCart(e.currentTarget.dataset.cartId));
                    });
                },

                calculateItemTotal(item) {
                     const price = item.product.price || 0;
                     if (item.quantity) return price * item.quantity;
                     if (item.weightGrams) return (price / 1000) * item.weightGrams;
                     return 0;
                },
                
                async processSale() {
                    if (Object.keys(this.cart).length === 0) {
                        this.showSnackbar("Cart is empty.", true);
                        return;
                    }
                    this.showModal(this.createLoadingModal('Processing sale...'));
                    const saleData = {
                        items: this.getCartAsArray().map(item => ({
                            'product_id': item.product.id,
                            'quantity': item.quantity || 0,
                            'weight_grams': item.weightGrams || 0,
                            'total': this.calculateItemTotal(item),
                            'unit_type': item.product.unit_type
                        })),
                        'total_amount': this.getCartTotal(),
                        'outlet_id': this.selectedOutlet.id,
                        'staff_id': this.selectedStaff.id
                    };
                    try {
                        const response = await fetch(`${this.API_BASE_URL}/sales/process/`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(saleData)
                        });
                        const responseData = await response.json();
                        if (!response.ok) {
                            throw new Error(responseData.error || 'Failed to process sale.');
                        }
                        this.closeModal();
                        this.showModal(this.createSaleSuccessModal(responseData.numeric_bill_id));
                        this.cart = {};
                        this.renderCart();
                        this.fetchProducts();
                    } catch (error) {
                        this.closeModal();
                        this.showSnackbar(error.message, true);
                    }
                },
                
                printBill(items, billId, isReprint = false) {
                    if (items.length === 0) {
                        this.showSnackbar("Cannot print an empty bill.", true);
                        return;
                    }
                    const billDate = new Date().toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' });
                    const total = items.reduce((sum, item) => sum + this.calculateItemTotal(item), 0);
                    const printContent = `
                        <style> body { font-family: monospace; font-size: 12px; margin: 0; padding: 10px; } h1, h2, p { margin: 0; } .center { text-align: center; } hr { border: none; border-top: 1px dashed #000; margin: 8px 0; } table { width: 100%; border-collapse: collapse; } th, td { padding: 2px 0; } .right { text-align: right; } .total { font-size: 14px; font-weight: bold; } @media print { @page { margin: 0; } body { margin: 1.6cm; } } </style>
                        <div class="center"><h1>ASTHANA BAKERY</h1><p>Branch: ${this.selectedOutlet.name}</p><p>Phone: ${this.selectedOutlet.phone || 'N/A'}</p></div><hr><p>Bill No: ${billId || new Date().getTime().toString().slice(-6)}</p><p>Date: ${billDate}</p><p>Billed By: ${this.selectedStaff.name}</p><hr><table><thead><tr><th>Item</th><th class="right">Qty/Wt</th><th class="right">Total</th></tr></thead><tbody>${items.map(item => `<tr><td>${item.product.name}</td><td class="right">${item.quantity || (item.weightGrams + 'g')}</td><td class="right">₹${this.calculateItemTotal(item).toFixed(2)}</td></tr>`).join('')}</tbody></table><hr><p class="total right">TOTAL: ₹${total.toFixed(2)}</p><hr><div class="center"><p>Thank you for your visit!</p></div>
                    `;
                    const printWindow = window.open('', '_blank');
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                    printWindow.focus();
                    setTimeout(() => { printWindow.print(); printWindow.close(); }, 250);
                },

                async promptForReprint() {
                     this.showModal(`
                         <h3 class="text-lg font-bold mb-4">Reprint Bill</h3><p class="mb-2 text-sm text-gray-600">Enter the Bill Number to find and reprint the receipt.</p><input type="number" id="reprint-bill-id" class="w-full p-2 border rounded-lg" placeholder="Enter Bill No."><div class="flex justify-end space-x-2 mt-4"><button class="btn-secondary px-4 py-2 rounded-lg" onclick="app.closeModal()">Cancel</button><button class="btn-primary px-4 py-2 rounded-lg" onclick="app.findAndReprintBill()">Find Bill</button></div>
                     `);
                },

                async findAndReprintBill() {
                    const billId = document.getElementById('reprint-bill-id').value;
                    if (!billId) {
                        this.showSnackbar("Please enter a bill number.", true);
                        return;
                    }
                    this.closeModal();
                    this.showModal(this.createLoadingModal(`Finding bill ${billId}...`));
                    try {
                         const response = await fetch(`${this.API_BASE_URL}/sales/find/${billId}/`);
                         const data = await response.json();
                         if(!response.ok) throw new Error(data.error || 'Bill not found');
                         const reprintedItems = data.items.map(itemData => ({ product: { id: itemData.product_id, name: itemData.name || 'Unknown Item', price: (itemData.total / (itemData.quantity || 1)), unit_type: itemData.unit_type }, quantity: itemData.quantity, weightGrams: itemData.weight_grams }));
                         this.closeModal();
                         this.printBill(reprintedItems, billId, true);
                    } catch (error) {
                        this.closeModal();
                        this.showSnackbar(error.message, true);
                    }
                },
                
                setLoadingText(text) {
                    this.elements.loadingText.textContent = text;
                },
                showSetupError(message) {
                    this.elements.loaderSpinner.classList.add('hidden');
                    this.elements.loadingText.classList.add('hidden');
                    this.elements.setupSection.classList.remove('hidden');
                    this.elements.setupError.textContent = message;
                    this.elements.retryBtn.classList.remove('hidden');
                },
                getCartAsArray() { return Object.values(this.cart); },
                getCartTotal() { return this.getCartAsArray().reduce((sum, item) => sum + this.calculateItemTotal(item), 0); },
                showSnackbar(message, isError = false) {
                    const el = this.elements.snackbar;
                    el.textContent = message;
                    el.style.backgroundColor = isError ? '#C53030' : '#2F855A';
                    el.style.opacity = '1';
                    setTimeout(() => { el.style.opacity = '0'; }, 3000);
                },
                
                showModal(content) {
                    this.elements.modalContainer.innerHTML = `<div class="modal-overlay fixed inset-0 z-40 flex items-center justify-center p-4"><div class="modal-content bg-white rounded-lg shadow-xl p-6 w-full max-w-sm">${content}</div></div>`;
                },
                closeModal() { this.elements.modalContainer.innerHTML = ''; },
                showPieceModal(product) {
                    this.showModal(`<h3 class="text-lg font-bold mb-4">Add ${product.name}</h3><p class="mb-4 text-sm text-gray-600">Price: ₹${(product.price || 0).toFixed(2)} per piece</p><input type="number" id="piece-qty" class="w-full p-2 border rounded-lg" value="1" min="1"><div class="flex justify-end space-x-2 mt-4"><button class="btn-secondary px-4 py-2 rounded-lg" onclick="app.closeModal()">Cancel</button><button class="btn-primary px-4 py-2 rounded-lg" onclick="app.confirmPieceModal('${product.id}')">Add to Cart</button></div>`);
                    document.getElementById('piece-qty').focus();
                },
                confirmPieceModal(productId) {
                    const product = this.products.find(p => p.id === productId);
                    const quantity = parseInt(document.getElementById('piece-qty').value, 10);
                    if (product && quantity > 0) {
                        this.addToCart(product, { quantity });
                        this.closeModal();
                    } else { this.showSnackbar("Please enter a valid quantity.", true); }
                },
                showWeightModal(product) {
                    const price = product.price || 0;
                    this.showModal(`<h3 class="text-lg font-bold mb-4">Add ${product.name}</h3><p class="mb-4 text-sm text-gray-600">Price: ₹${price.toFixed(2)} per kg</p><div class="space-y-4"><div><label class="block text-sm font-medium">Weight (grams)</label><input type="number" id="weight-grams" class="w-full p-2 border rounded-lg"></div><div><label class="block text-sm font-medium">Price (₹)</label><input type="number" id="weight-price" class="w-full p-2 border rounded-lg"></div></div><div class="flex justify-end space-x-2 mt-4"><button class="btn-secondary px-4 py-2 rounded-lg" onclick="app.closeModal()">Cancel</button><button class="btn-primary px-4 py-2 rounded-lg" onclick="app.confirmWeightModal('${product.id}')">Add to Cart</button></div>`);
                    const weightInput = document.getElementById('weight-grams');
                    const priceInput = document.getElementById('weight-price');
                    weightInput.addEventListener('input', () => {
                        const weight = parseFloat(weightInput.value) || 0;
                        priceInput.value = ((price / 1000) * weight).toFixed(2);
                    });
                    priceInput.addEventListener('input', () => {
                        const newPrice = parseFloat(priceInput.value) || 0;
                        if(price > 0) { weightInput.value = Math.round((newPrice / price) * 1000); }
                    });
                    weightInput.focus();
                },
                confirmWeightModal(productId) {
                    const product = this.products.find(p => p.id === productId);
                    const weightGrams = parseFloat(document.getElementById('weight-grams').value);
                    if (product && weightGrams > 0) {
                        this.addToCart(product, { weightGrams });
                        this.closeModal();
                    } else { this.showSnackbar("Please enter a valid weight or price.", true); }
                },
                createLoadingModal(text) { return `<div class="flex items-center justify-center p-4"><div class="loader mr-4"></div><p>${text}</p></div>`; },
                createSaleSuccessModal(billId) {
                    return `<div class="text-center"><i class="fa-solid fa-circle-check fa-4x text-green-500 mb-4"></i><h3 class="text-xl font-bold">Sale Completed!</h3><p class="text-gray-600 mt-2">Bill No: <strong>${billId}</strong></p><p class="text-gray-600">Total: <strong>₹${this.getCartTotal().toFixed(2)}</strong></p><div class="flex justify-center space-x-2 mt-6"><button class="btn-secondary px-4 py-2 rounded-lg" onclick="app.closeModal()">OK</button><button class="btn-primary px-4 py-2 rounded-lg" onclick="app.printBill(app.getCartAsArray(), '${billId}'); app.closeModal();">Print Bill</button></div></div>`;
                },
                handleResize() {
                    const cartSection = this.elements.cartSection;
                    if (window.innerWidth < 768) { 
                        cartSection.classList.add('mobile-overlay', 'fixed', 'top-0', 'right-0', 'h-full', 'z-30');
                        cartSection.classList.remove('flex');
                        cartSection.classList.add('hidden');

                    } else {
                        cartSection.classList.remove('mobile-overlay', 'fixed', 'top-0', 'right-0', 'h-full', 'z-30', 'hidden', 'active');
                        cartSection.classList.add('flex');
                    }
                },
                showMobileCart() {
                    const cartSection = this.elements.cartSection;
                    cartSection.classList.remove('hidden');
                    // Timeout to allow the display property to apply before transitioning
                    setTimeout(() => cartSection.classList.add('active'), 10);
                },
                hideMobileCart() {
                    const cartSection = this.elements.cartSection;
                    cartSection.classList.remove('active');
                     // Hide the element after the transition ends
                    setTimeout(() => cartSection.classList.add('hidden'), 300);
                }
            };
            
            app.init();
            window.app = app;
        });
    </script>
</body>
</html>
